name: Bug Report
description: File a bug report to help us improve MCPForge
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much detail as possible to help us reproduce and resolve the issue.

  - type: input
    id: version
    attributes:
      label: MCPForge Version
      description: What version of MCPForge are you using? (Run `mcpforge --version`)
      placeholder: e.g. v0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running on?
      options:
        - Linux (x86_64)
        - Linux (ARM64)
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel)
        - Windows (x64)
    validations:
      required: true

  - type: input
    id: clients
    attributes:
      label: Affected Client(s) / Harness(es)
      description: Which client adapter(s) are involved? (e.g. Claude Code, Cursor, VS Code, Freebuff, Codex, Goose, etc.)
      placeholder: e.g. Cursor, Claude Desktop

  - type: textarea
    id: what-happened
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. In TUI press '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Schema Verification
      description: Please paste any relevant command outputs, schema verify outputs (`mcpforge verify`), or backtraces (`RUST_BACKTRACE=1`).
      render: shell
