[package]
name = "mcpforge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "The fast, zero-runtime TUI that discovers every MCP client on your machine and syncs them all"
default-run = "mcpforge"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
name = "mcpforge"
path = "src/lib.rs"

[[bin]]
name = "mcpforge"
path = "src/main.rs"

[[bin]]
name = "screenshots"
path = "src/bin/screenshots.rs"

[dependencies]
mcp-core = { package = "mcpforge-core", path = "../mcp-core", version = "0.2.0" }
mcpforge-adapters = { path = "../mcpforge-adapters", version = "0.2.0" }
mcpforge-registry = { path = "../mcpforge-registry", version = "0.2.0" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
ratatui.workspace = true
crossterm.workspace = true
clap.workspace = true
clap_complete.workspace = true
chrono.workspace = true
similar.workspace = true
toml.workspace = true
serde_yaml.workspace = true
