GOOSE_PROVIDER: anthropic
GOOSE_MODEL: claude-3-7-sonnet
extensions:
  fetch:
    name: fetch
    type: stdio
    cmd: uvx
    args:
    - mcp-server-fetch
    enabled: true
  memory:
    name: memory
    type: stdio
    cmd: npx
    args:
    - -y
    - '@modelcontextprotocol/server-memory'
    enabled: true
telemetry: false
verbose: true
