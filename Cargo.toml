[workspace]
members = [
    "crates/mcp-core",
    "crates/mcpforge-adapters",
    "crates/mcpforge-registry",
    "crates/mcpforge",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["MCPForge Contributors"]
license = "MIT"
repository = "https://github.com/nordicnode/mcpforge"
homepage = "https://github.com/nordicnode/mcpforge"
readme = "README.md"
keywords = ["mcp", "tui", "ratatui", "ai-agents", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5.0"
tempfile = "3.16"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
fuzzy-matcher = "0.3"
similar = "2.7"
toml = "0.8"
serde_yaml = "0.9"
